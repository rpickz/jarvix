# my config, hand-written
[knowledge]
max_injected_tokens = 400

# --- the feeds section ---

# watches the AMD price
[[knowledge.feeds]]
name = "amd"
description = "AMD share price"
command = ["/home/me/bin/amd-price"]
mode = "eager"

# the neighbour must not move
[[knowledge.feeds]]
name = "weather"
description = "Local weather"
command = ["/home/me/bin/weather", "--short"]
mode = "lazy"

[tts]
provider = "piper"
