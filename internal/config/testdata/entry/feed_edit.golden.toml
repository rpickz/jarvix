# my config, hand-written
[knowledge]
max_injected_tokens = 400

# watches the AMD price
[[knowledge.feeds]]
name = "amd"
description = "AMD share price in dollars"
command = ["/home/me/bin/amd-price", "--currency", "usd"]
mode = "eager"
interval_sec = 120
ttl_sec = 600
inject = true

# the neighbour must not move
[[knowledge.feeds]]
name = "weather"
description = "Local weather"
command = ["/home/me/bin/weather", "--short"]
mode = "lazy"

[tts]
provider = "piper"
