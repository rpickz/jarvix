# my config, hand-written
[context]
window = false

# the scripts I trust with a phrase
[[scripts]]
name = "backup notes"
phrases = ["backup my notes", "run the backup"]
path = "/home/me/bin/backup-notes-v2.sh"
timeout_sec = 120
schedule = "03:30"
announce = true

# still experimenting with this one
[[scripts]]
name = "rotate wallpaper"
phrases = ["rotate the wallpaper"]
path = "/home/me/bin/rotate-wallpaper.sh"
report = "silent"
