# my config, hand-written
[context]
window = false

# the scripts I trust with a phrase
[[scripts]]
name = "backup notes"
phrases = ["backup my notes"]
path = "/home/me/bin/backup-notes.sh" # the audited copy
schedule = "02:00"

[[scripts]]
name = "rotate wallpaper"
phrases = ["rotate the wallpaper"]
path = "/home/me/bin/rotate-wallpaper.sh"
timeout_sec = 30
report = "silent"
enabled = false
