# Test-depth jobs (issue #8): short fuzz regression pass and benchmarks.
#
# Kept separate from ci.yml (the CI-gate ticket owns that file) so the two
# tickets do not collide. fuzz-short is a required gate: it replays the
# committed corpora and fuzzes each parser briefly, catching regressions on
# known crashers. Benchmarks are informational — they record the numbers as
# an artifact per run on main so latency regressions are visible in review,
# but they never block a merge.
name: test-depth

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-short:
    name: fuzz (30s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Replay committed corpora
        run: go test -run 'Fuzz' ./...
      - name: Short fuzz pass
        run: make fuzz FUZZTIME=30s

  bench:
    name: benchmarks (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run benchmarks
        # Same make target as local runs — BENCHCOUNT=5 gives benchstat-able
        # samples; CI hardware is noisy, so treat these as trend data, not a
        # gate.
        run: make bench BENCHCOUNT=5 | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench.txt

  # The mutation job used to live here. It moved to
  # .github/workflows/mutation.yml in issue #172, along with the three things
  # it was missing: a defined package set, a surviving-mutant report kept as an
  # artefact, and a schedule that is its own rather than borrowed from this
  # file's triggers. The long property-fuzzing runs went with it, for the same
  # reason `fuzz-short` stays here — thirty seconds a target on a PR is a
  # regression check, five minutes a target is a search, and they belong on
  # different clocks. See docs/mutation.md.
