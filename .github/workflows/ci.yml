# CI gate: every push and PR gets a verdict on a clean runner with none of
# the external engines installed (no PipeWire, whisper, piper, kokoro) —
# proving the hermetic-test discipline holds. See issue #7.
name: ci

on:
  # Every branch, not just main. Restricting the push trigger to main meant a
  # feature branch without an open PR got no verdict at all, which is the one
  # thing this workflow promises (raised in review of #15).
  push:
  pull_request:

permissions:
  contents: read

# One run per commit. With push covering every branch, a branch that also has
# an open PR fires both triggers for the same code; keying the group on the
# commit (github.sha for a push, the PR's head sha for a pull_request — the
# same value) makes the second trigger cancel the redundant first instead of
# paying for both. Distinct commits land in distinct groups, so no push ever
# loses its verdict to a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Test (race, twice to surface order dependence)
        run: go test -race -count=2 ./... 2>&1 | tee test.log
        shell: bash
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
      - name: Coverage baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned, not "latest": with latest, a golangci-lint release can
          # turn an unchanged commit red overnight and the gate stops being
          # reproducible. Bump this deliberately, in its own PR, so the new
          # findings are reviewed as a change (raised in review of #15).
          version: v2.13.1
