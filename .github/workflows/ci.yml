# CI gate: every push and PR gets a verdict on a clean runner with none of
# the external engines installed (no PipeWire, whisper, piper, kokoro) —
# proving the hermetic-test discipline holds. See issue #7.
name: ci

on:
  # Every branch, not just main. Restricting the push trigger to main meant a
  # feature branch without an open PR got no verdict at all, which is the one
  # thing this workflow promises (raised in review of #15).
  push:
  pull_request:

permissions:
  contents: read

# One run at a time per commit, keyed on the commit (github.sha for a push,
# the PR's head sha for a pull_request — the same value) rather than on the
# branch, so distinct commits never contend and no push loses its verdict to
# a later one.
#
# cancel-in-progress is deliberately FALSE. Cancelling is the usual setting
# and it is wrong here twice over: a cancelled run is a lost verdict, which
# is the one thing the first line of this file promises, and it shows up as a
# red check besides. The same-repo guard below is what removes the duplicate;
# this group only stops two runs of one commit overlapping.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

# Both jobs carry the same guard: skip the pull_request run for a branch in
# this repo, because the push trigger above already graded that exact commit
# and checks attach to the commit, so the PR shows the verdict either way. A
# skipped job is neutral — letting concurrency cancel the duplicate instead
# would leave a red "cancelled" entry sitting next to the green one. Fork PRs
# are why the pull_request trigger stays at all: their pushes land in someone
# else's repository and fire no push event here.
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Test (race, twice to surface order dependence)
        run: go test -race -count=2 ./... 2>&1 | tee test.log
        shell: bash
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
  # The coverage ratchet (issue #171). Its own job, not a step on `test`,
  # because it must not add to the gate's wall-clock: it runs beside the race
  # pass rather than after it, and a plain `go test -coverprofile ./...` is a
  # fraction of the race run's cost.
  #
  # It replaced a "coverage baseline" step that measured the number on main and
  # uploaded it — which recorded the slide rather than stopping it. See
  # coverage.floor for what the floor is and is not.
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Coverage ratchet
        run: scripts/coverage-ratchet.sh
      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # The QML behaviour suite (issue #174): the real conversation window, run
  # headless against a fake daemon. Its own job, beside the Go gate rather than
  # after it, so it costs the gate no wall-clock — and because it needs Qt,
  # which the Go jobs have no use for.
  #
  # Every push, not a schedule. The suite is about three seconds because it
  # contains no sleeps: every test drives an event and asserts on the next
  # line. The runner install is the only slow part, and it is what the apt
  # cache is for. If this ever grows past the Go gate's own time, the fix is
  # the test that started waiting.
  #
  # There is no `continue-on-error` and no skip. `scripts/qml-test.sh` exits
  # non-zero when it cannot find a Qt 6 qmltestrunner, which is the whole point
  # of the acceptance criterion: a gate that skips when its tool is missing
  # reports green on the exact machine where it stopped running.
  qml:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No compositor, no display server, no GPU on this runner — which is
      # exactly the machine the criterion names. The suite runs on the
      # offscreen platform with the software scene graph (both set by the
      # script), so nothing here installs a window manager or an X server.
      #
      # The QtQml/QtQuick modules go in by glob rather than by name. Ubuntu
      # splits every QML submodule into its own package, and naming them one at
      # a time was whack-a-mole: WorkerScript was missing, then QtQuick.Window.
      # Each gap failed the job loudly — which is the availability check working
      # — but the fix belongs in one line, not in a growing list.
      - name: Install the Qt 6 QML test runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools \
            qt6-qpa-plugins \
            qml6-module-qttest \
            'qml6-module-qtqml*' \
            'qml6-module-qtquick*'
      - name: QML behaviour suite
        run: scripts/qml-test.sh

  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned, not "latest": with latest, a golangci-lint release can
          # turn an unchanged commit red overnight and the gate stops being
          # reproducible. Bump this deliberately, in its own PR, so the new
          # findings are reviewed as a change (raised in review of #15).
          version: v2.13.1
