# CI gate: every push and PR gets a verdict on a clean runner with none of
# the external engines installed (no PipeWire, whisper, piper, kokoro) —
# proving the hermetic-test discipline holds. See issue #7.
name: ci

on:
  # Every branch, not just main. Restricting the push trigger to main meant a
  # feature branch without an open PR got no verdict at all, which is the one
  # thing this workflow promises (raised in review of #15).
  push:
  pull_request:

permissions:
  contents: read

# One run at a time per commit, keyed on the commit (github.sha for a push,
# the PR's head sha for a pull_request — the same value) rather than on the
# branch, so distinct commits never contend and no push loses its verdict to
# a later one.
#
# cancel-in-progress is deliberately FALSE. Cancelling is the usual setting
# and it is wrong here twice over: a cancelled run is a lost verdict, which
# is the one thing the first line of this file promises, and it shows up as a
# red check besides. The same-repo guard below is what removes the duplicate;
# this group only stops two runs of one commit overlapping.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

# Both jobs carry the same guard: skip the pull_request run for a branch in
# this repo, because the push trigger above already graded that exact commit
# and checks attach to the commit, so the PR shows the verdict either way. A
# skipped job is neutral — letting concurrency cancel the duplicate instead
# would leave a red "cancelled" entry sitting next to the green one. Fork PRs
# are why the pull_request trigger stays at all: their pushes land in someone
# else's repository and fire no push event here.
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Test (race, twice to surface order dependence)
        run: go test -race -count=2 ./... 2>&1 | tee test.log
        shell: bash
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
      - name: Coverage baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned, not "latest": with latest, a golangci-lint release can
          # turn an unchanged commit red overnight and the gate stops being
          # reproducible. Bump this deliberately, in its own PR, so the new
          # findings are reviewed as a change (raised in review of #15).
          version: v2.13.1
